<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Anchor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="brand">review anchor</span>
  <span class="badges">
    <span class="badge" id="branch">…</span>
    <span class="badge" id="bookmark">…</span>
    <span class="badge warn" id="stale" hidden>doc changed since anchoring</span>
  </span>
  <span class="spacer"></span>
  <label class="ctl">exchange
    <select id="log"></select>
  </label>
  <label class="ctl">font
    <input type="range" id="size" min="10" max="22" step="1" value="14">
    <span id="sizeout">14px</span>
  </label>
  <label class="ctl">
    <select id="family">
      <option value="ui-monospace, SFMono-Regular, Menlo, monospace">mono</option>
      <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">system</option>
      <option value="Georgia, 'Times New Roman', serif">serif</option>
    </select>
  </label>
  <button id="new">new</button>
</header>

<main>
  <section id="docpane">
    <div class="panehead"><span id="docname">…</span><span class="hint">click a line to anchor a comment · shift-click for a range</span></div>
    <div id="doc" class="doc"></div>
  </section>

  <section id="side">
    <nav class="tabs">
      <button data-tab="prompt" class="on">prompt</button>
      <button data-tab="anchors">anchors <span id="ancount" class="pill">0</span></button>
      <button data-tab="response">response</button>
      <button data-tab="commit">commit</button>
    </nav>

    <div class="tabbody" data-tab="prompt">
      <label class="field">model <input id="model" placeholder="claude opus 5"></label>
      <label class="field">subject <input id="subject" placeholder="defaults to the model name"></label>
      <textarea id="prompt" placeholder="What you are asking for. This becomes the commit body, exactly as typed."></textarea>
      <div class="row">
        <button id="copyprompt" class="primary">copy prompt + anchors</button>
        <span class="hint">paste it into the chat, then bring the answer back</span>
      </div>
    </div>

    <div class="tabbody" data-tab="anchors" hidden>
      <div id="anchors"></div>
      <div class="row"><button id="verify">verify anchors</button><span class="hint" id="verifyout"></span></div>
    </div>

    <div class="tabbody" data-tab="response" hidden>
      <textarea id="response" placeholder="Paste the model's reply here. It stays in the exchange file, not in the commit message."></textarea>
      <div class="row"><button id="pasteresponse">paste from clipboard</button></div>
    </div>

    <div class="tabbody" data-tab="commit" hidden>
      <label class="field inline"><input type="checkbox" id="bare"> bare commit — subject line only, the <code>pending-push</code> style</label>
      <pre id="commit"></pre>
      <div class="row">
        <button id="copycommit">copy message</button>
        <button id="docommit" class="primary">git add -A &amp;&amp; commit</button>
      </div>
    </div>
  </section>
</main>

<dialog id="commentbox">
  <form method="dialog">
    <p id="commentwhere" class="hint"></p>
    <pre id="commentquote"></pre>
    <textarea id="commenttext" placeholder="comment"></textarea>
    <menu><button value="cancel">cancel</button><button value="ok" class="primary">anchor</button></menu>
  </form>
</dialog>

<footer id="status">ready</footer>
<script src="app.js"></script>
</body>
</html>
